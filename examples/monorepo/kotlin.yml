# Copy to .github/workflows/kotlin.yml in a multi-language repository.
name: Kotlin
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/kotlin-quality.yml
    with:
      project-directory: kotlin
      additional-paths: |
        native/kotlin/links-notation
        packages/ui-kotlin
        examples/kotlin
        native/parity
        docs/spec
        packages/ui-tokens/tests/golden
        docs/case-studies/issue-1/samples
      fast-tasks: ktlintCheck detekt compileTestKotlinJvm compileTestKotlinJs
      test-tasks: jvmTest jsNodeTest
