name: Kotlin quality

on:
  workflow_call:
    inputs:
      project-directory:
        description: Gradle project directory relative to the checkout.
        type: string
        default: .
      additional-paths:
        description: Newline-separated repository paths used by this project's tests.
        type: string
        default: ''
      java-version:
        type: string
        default: '21'
      fast-tasks:
        description: Gradle formatting, lint and compilation tasks, separated by spaces.
        type: string
        default: ktlintCheck detekt compileTestKotlinJvm compileTestKotlinJs
      test-tasks:
        description: Gradle test tasks, separated by spaces.
        type: string
        default: jvmTest jsNodeTest
      versioning:
        description: Check the template's Gradle version and changeset policy.
        type: boolean
        default: false
      build-docker:
        description: Test this project's Dockerfile on native amd64 and arm64 runners.
        type: boolean
        default: false
      force-checks:
        description: Run Kotlin checks and the lockfile audit for a pending release.
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PROJECT: ${{ inputs.project-directory }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-${{ inputs.project-directory }}-plan
      cancel-in-progress: true
    outputs:
      kotlin: ${{ steps.paths.outputs.kotlin }}
      container: ${{ steps.paths.outputs.container }}
      docs: ${{ steps.paths.outputs.docs }}
      workflow: ${{ steps.paths.outputs.workflow }}
      merge_base: ${{ steps.paths.outputs.merge_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changes against the current base
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          ADDITIONAL_PATHS: ${{ inputs.additional-paths }}
          VERSIONING: ${{ inputs.versioning }}
        run: |
          flags=()
          if [[ $VERSIONING == true ]]; then flags+=(--versioning); fi
          python3 "$PROJECT/scripts/ci.py" plan --project "$PROJECT" --additional-paths "$ADDITIONAL_PATHS" "${flags[@]}"
      - name: Install credential scanner
        run: bash "$PROJECT/scripts/install-ci-tool.sh" gitleaks
      - name: Scan incoming commits for credentials
        env:
          MERGE_BASE: ${{ steps.paths.outputs.merge_base }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="${MERGE_BASE:-$BEFORE_SHA}"
          range=HEAD^!
          if [[ $base =~ ^[a-f0-9]{40}$ ]] && git cat-file -e "$base^{commit}"; then
            range="$base..HEAD"
          fi
          gitleaks git --no-banner --redact --log-opts="$range" --exit-code=1

  workflow-lint:
    needs: plan
    if: needs.plan.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-${{ inputs.project-directory }}-workflow-lint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Recreate the tested merge
        env:
          MERGE_BASE: ${{ needs.plan.outputs.merge_base }}
        run: python3 "$PROJECT/scripts/ci.py" merge "$MERGE_BASE"
      - name: Lint workflow syntax and shell
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          version: '1.32.0'
          advanced-security: false
          annotations: true
          min-confidence: medium
          online-audits: false

  docs:
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-${{ inputs.project-directory }}-docs
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Recreate the tested merge
        env:
          MERGE_BASE: ${{ needs.plan.outputs.merge_base }}
        run: python3 "$PROJECT/scripts/ci.py" merge "$MERGE_BASE"
      - name: Validate Markdown size and template headings
        env:
          VERSIONING: ${{ inputs.versioning }}
        run: |
          flags=()
          if [[ $VERSIONING == true ]]; then flags+=(--docs); fi
          python3 "$PROJECT/scripts/ci.py" files --project "$PROJECT" "${flags[@]}"
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          workingDirectory: ${{ inputs.project-directory }}
          lycheeVersion: v0.24.2
          args: "--offline --no-progress --include-fragments --exclude-path build --exclude-path .gradle './**/*.md' './.changeset/*.md'"
          failIfEmpty: false
          token: ''

  dependency-audit:
    needs: plan
    if: needs.plan.outputs.kotlin == 'true' || needs.plan.outputs.workflow == 'true' || inputs.force-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-${{ inputs.project-directory }}-dependency-audit
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Recreate the tested merge
        env:
          MERGE_BASE: ${{ needs.plan.outputs.merge_base }}
        run: python3 "$PROJECT/scripts/ci.py" merge "$MERGE_BASE"
      - run: bash "$PROJECT/scripts/install-ci-tool.sh" osv-scanner
      - name: Audit committed dependencies
        working-directory: ${{ inputs.project-directory }}
        run: bash scripts/audit-dependencies.sh

  fast:
    needs: plan
    if: >-
      needs.plan.outputs.kotlin == 'true' || needs.plan.outputs.workflow == 'true' ||
      (inputs.build-docker && needs.plan.outputs.container == 'true') || inputs.force-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-${{ inputs.project-directory }}-fast
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Recreate the tested merge
        env:
          MERGE_BASE: ${{ needs.plan.outputs.merge_base }}
        run: python3 "$PROJECT/scripts/ci.py" merge "$MERGE_BASE"
      - run: python3 "$PROJECT/scripts/ci.py" files --project "$PROJECT"
      - name: Run pipeline regression tests
        working-directory: ${{ inputs.project-directory }}
        run: python3 -m unittest discover -s tests -v
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Check formatting, lint and test compilation
        working-directory: ${{ inputs.project-directory }}
        env:
          TASKS: ${{ inputs.fast-tasks }}
        run: |
          read -r -a tasks <<< "$TASKS"
          ./gradlew --no-daemon --console=plain "${tasks[@]}"

  test:
    needs: [plan, fast, dependency-audit, workflow-lint, docs]
    if: >-
      !cancelled() && needs.fast.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-${{ inputs.project-directory }}-test
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Recreate the tested merge
        env:
          MERGE_BASE: ${{ needs.plan.outputs.merge_base }}
        run: python3 "$PROJECT/scripts/ci.py" merge "$MERGE_BASE"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Run every enabled target test
        working-directory: ${{ inputs.project-directory }}
        env:
          TASKS: ${{ inputs.test-tasks }}
          VERSIONING: ${{ inputs.versioning }}
          CONTAINER: ${{ inputs.build-docker }}
        run: |
          read -r -a tasks <<< "$TASKS"
          if [[ $VERSIONING == true ]]; then tasks+=(publishAllPublicationsToBundleRepository); fi
          if [[ $CONTAINER == true ]]; then tasks+=(stageRuntime); fi
          mkdir -p build/pipeline
          ./gradlew --no-daemon --console=plain "${tasks[@]}" 2>&1 | tee build/pipeline/gradle.log
          git diff --exit-code -- ':(glob)**/gradle.lockfile' ':(glob)**/kotlin-js-store/*'
      - name: Upload test and compiler reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-test-reports-${{ github.run_attempt }}
          path: |
            ${{ inputs.project-directory }}/build/pipeline/gradle.log
            ${{ inputs.project-directory }}/**/build/test-results/**/*.xml
            ${{ inputs.project-directory }}/**/build/reports/problems/*
          retention-days: 7
          if-no-files-found: warn
      - name: Share tested JVM distribution with Docker jobs
        if: inputs.build-docker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-smoke-runtime-${{ github.run_attempt }}
          path: ${{ inputs.project-directory }}/build/runtime/*.jar
          if-no-files-found: error
          retention-days: 3

  docker:
    needs: [plan, test]
    if: needs.test.result == 'success' && inputs.build-docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-${{ inputs.project-directory }}-docker-${{ matrix.arch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Recreate the tested merge
        env:
          MERGE_BASE: ${{ needs.plan.outputs.merge_base }}
        run: python3 "$PROJECT/scripts/ci.py" merge "$MERGE_BASE"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kotlin-smoke-runtime-${{ github.run_attempt }}
          path: ${{ inputs.project-directory }}/build/runtime
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.project-directory }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: kotlin-pipeline:smoke
          cache-from: type=gha,scope=kotlin-${{ matrix.arch }}
          cache-to: type=gha,scope=kotlin-${{ matrix.arch }},mode=max
      - name: Smoke-test the native image
        run: test "$(docker run --rm --network none kotlin-pipeline:smoke Ada)" = 'Hello, Ada!'

  status:
    name: Pipeline Status
    needs: [plan, docs, workflow-lint, dependency-audit, fast, test, docker]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-${{ inputs.project-directory }}-status
      cancel-in-progress: true
    steps:
      - name: Check required results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          FORCE_CHECKS: ${{ inputs.force-checks }}
          BUILD_DOCKER: ${{ inputs.build-docker }}
        run: |
          want=(plan)
          if [[ $(jq -r '.plan.outputs.docs' <<< "$NEEDS_JSON") == true ]]; then want+=(docs); fi
          workflow=$(jq -r '.plan.outputs.workflow' <<< "$NEEDS_JSON")
          kotlin=$(jq -r '.plan.outputs.kotlin' <<< "$NEEDS_JSON")
          container=$(jq -r '.plan.outputs.container' <<< "$NEEDS_JSON")
          if [[ $workflow == true ]]; then want+=(workflow-lint); fi
          if [[ $workflow == true || $kotlin == true || $FORCE_CHECKS == true ]]; then
            want+=(dependency-audit fast test)
          elif [[ $BUILD_DOCKER == true && $container == true ]]; then
            want+=(fast test)
          fi
          if [[ $BUILD_DOCKER == true ]] && [[ " ${want[*]} " == *" test "* ]]; then want+=(docker); fi
          for job in "${want[@]}"; do
            if [[ $(jq -r --arg job "$job" '.[$job].result' <<< "$NEEDS_JSON") != success ]]; then
              echo "::error::Required job $job did not succeed"
              exit 1
            fi
          done
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS_JSON"
          echo "All selected jobs passed."
